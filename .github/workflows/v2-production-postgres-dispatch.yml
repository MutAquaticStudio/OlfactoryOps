name: V2 Production PostgreSQL Migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved SHA from the immutable production release tag or a v2-production tag.
        required: true
        type: string
      confirm_production:
        description: Type APPLY_PRODUCTION to apply immutable migrations and restrict the production runtime role.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-production-postgres-migration
  cancel-in-progress: false

env:

jobs:
  validate-production-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: revision
        name: Validate the approved production revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PRODUCTION" = "APPLY_PRODUCTION"
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --force --tags origin
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git tag --points-at "$RELEASE_SHA" -l 'v2-production-*' | grep -Eq '^v2-production-(rc[0-9][0-9]*|ready|live)$'
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  migrate-production:
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      V2_PRODUCTION_MIGRATION_APPROVED: APPLY_PRODUCTION
      V2_RUNTIME_DB_ROLE: hyperdrive_user
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the protected production database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL"
      - name: Apply the immutable V2 production migration chain
        run: npm run migrate:v2-production
      - name: Restrict and verify the production Hyperdrive runtime role
        run: npm run configure:v2-production-runtime-role
