name: V2 Staging Tenant Router Deployment

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact current SHA of main.
        required: true
        type: string
      confirm_staging:
        description: Type DEPLOY_STAGING_TENANT_ROUTER to deploy only the staging tenant router.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-tenant-router-deployment
  cancel-in-progress: false

env:
  STAGING_BRANCH: main
  STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3
  STAGING_ROUTER_NAME: olfactoryops-v2-tenant-router-staging

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        name: Validate the approved staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STAGING" = "DEPLOY_STAGING_TENANT_ROUTER"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  deploy-staging-tenant-router:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_TENANT_ROUTER_STAGING_GIT_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      V2_TENANT_ROUTER_STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the V2 Prisma client for the router runtime
        run: npm run prisma:generate:v2
      - name: Require staging-only Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Render the non-secret staging tenant router configuration
        run: node scripts/render-v2-tenant-router-staging-config.mjs
      - name: Deploy the exact staging tenant-router revision
        run: npx wrangler deploy --config .qa/wrangler.v2-tenant-router-staging.toml --keep-vars
      - name: Verify active router revision and staging-only bindings
        shell: bash
        env:
          STAGING_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
          STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3
          STAGING_ROUTER_NAME: olfactoryops-v2-tenant-router-staging
        run: |
          set -euo pipefail
          deployment_json="$(mktemp)"
          version_json="$(mktemp)"
          trap 'rm -f "$deployment_json" "$version_json"' EXIT
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$STAGING_ROUTER_NAME/deployments" \
            --output "$deployment_json"
          deployed_version_id="$(node --input-type=module - "$deployment_json" <<'NODE'
          import { readFileSync } from 'node:fs'
          const body = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const versions = body?.success === true ? body?.result?.deployments?.[0]?.versions : undefined
          if (!Array.isArray(versions) || versions.length !== 1 || versions[0]?.percentage !== 100 || typeof versions[0]?.version_id !== 'string') {
            throw new Error('expected one active 100-percent staging tenant-router version')
          }
          process.stdout.write(versions[0].version_id)
          NODE
          )"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$STAGING_ROUTER_NAME/versions/$deployed_version_id" \
            --output "$version_json"
          VERSION_JSON="$version_json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const body = JSON.parse(readFileSync(process.env.VERSION_JSON, 'utf8'))
          if (body?.success !== true) throw new Error('tenant router version lookup failed')
          const bindings = body?.result?.resources?.bindings
          if (!Array.isArray(bindings)) throw new Error('tenant router has no binding metadata')
          const plain = (name) => bindings.find((binding) => binding?.name === name && binding?.type === 'plain_text')?.text
          const hyperdrive = bindings.find((binding) => binding?.name === 'HYPERDRIVE' && binding?.type === 'hyperdrive')
          if (plain('RELEASE_GIT_SHA') !== process.env.STAGING_SHA) throw new Error('router release SHA does not match approved staging revision')
          if (plain('V2_WORKSPACE_BASE_DOMAIN') !== 'api-beta.labofscents.org') throw new Error('router base domain is not the approved TLS-covered staging convention')
          if (plain('PAGES_ORIGIN') !== 'https://olfactoryops-beta.pages.dev') throw new Error('router Pages origin is not the staging Pages origin')
          if (hyperdrive?.id !== process.env.STAGING_HYPERDRIVE_ID) throw new Error('router Hyperdrive binding does not match staging')
          if (bindings.some((binding) => binding?.type === 'd1')) throw new Error('staging tenant router must not bind legacy D1')
          console.log('STAGING_TENANT_ROUTER_ACTIVE_VERSION=PASS')
          console.log('STAGING_TENANT_ROUTER_HYPERDRIVE=PASS')
          console.log('STAGING_TENANT_ROUTER_NO_D1=PASS')
          NODE
