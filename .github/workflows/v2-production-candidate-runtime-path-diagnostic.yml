name: V2 Production Candidate Hyperdrive Runtime Diagnostic

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC release SHA approved for this diagnostic.
        required: true
        type: string
      fixture_hostname:
        description: Exact isolated candidate workspace hostname under next.labofscents.org.
        required: true
        type: string
      confirm_diagnostic:
        description: Type DEPLOY_READ_ONLY_RUNTIME_DIAGNOSTIC to deploy and invoke the isolated diagnostic.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-production-candidate-runtime-path-diagnostic
  cancel-in-progress: false

env:
  RELEASE_BRANCH: codex/v2-production-go-live
  TARGET_RELEASE_SHA: de0734df2d2b5b2dd3a2a67ee542131235e75eb7
  EXPECTED_FIXTURE_HOSTNAME: rc9-release-31736285494-469ca8942a.next.labofscents.org
  EXPECTED_ORGANIZATION_ID_SHA: 9aa21989136c3edbd2f04466a25f38254f9611d1a251013f9106f2f8712f1a88
  EXPECTED_RUNTIME_ROLE_SHA: 4a84d79d5970e7f76b4e6a11d34519a43c9a8301a20d75966737c7561352b9a9
  EXPECTED_PRODUCTION_HYPERDRIVE_ID: b415b7572d9f45058ebb4ec4166b8739
  CANDIDATE_WORKSPACE_BASE_DOMAIN: next.labofscents.org
  DIAGNOSTIC_WORKER_NAME: oo-v2-router-rc9-runtime-diag

jobs:
  validate-diagnostic-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.validation.outputs.release_sha }}
      fixture_hostname: ${{ steps.validation.outputs.fixture_hostname }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      FIXTURE_HOSTNAME: ${{ inputs.fixture_hostname }}
      CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: validation
        name: Validate the exact RC9 target and route-free diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v2-runtime-diagnostic-dispatcher.mjs
          test "$CONFIRM_DIAGNOSTIC" = "DEPLOY_READ_ONLY_RUNTIME_DIAGNOSTIC"
          test "$RELEASE_SHA" = "$TARGET_RELEASE_SHA"
          test "$FIXTURE_HOSTNAME" = "$EXPECTED_FIXTURE_HOSTNAME"
          [[ "$TARGET_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ORGANIZATION_ID_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RUNTIME_ROLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_PRODUCTION_HYPERDRIVE_ID" = "b415b7572d9f45058ebb4ec4166b8739"
          suffix=".${CANDIDATE_WORKSPACE_BASE_DOMAIN}"
          slug="${FIXTURE_HOSTNAME%"$suffix"}"
          test "$slug" != "$FIXTURE_HOSTNAME"
          test "$FIXTURE_HOSTNAME" = "$(printf '%s' "$FIXTURE_HOSTNAME" | tr '[:upper:]' '[:lower:]')"
          [[ "$slug" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          git fetch --no-tags origin \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          git fetch --tags origin
          git cat-file -e "${TARGET_RELEASE_SHA}^{commit}"
          test "$(git rev-parse 'v2-production-rc9^{}')" = "$TARGET_RELEASE_SHA"
          test "$(git rev-parse "origin/$RELEASE_BRANCH")" = "$TARGET_RELEASE_SHA"
          [[ "$DIAGNOSTIC_WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          test "${#DIAGNOSTIC_WORKER_NAME}" -le 63
          for required_file in \
            worker/v2-tenant-router-runtime-diagnostic.ts \
            scripts/render-v2-tenant-router-runtime-diagnostic-config.mjs \
            wrangler.v2-tenant-router-runtime-diagnostic.example.toml; do
            test -f "$required_file"
          done
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "fixture_hostname=$FIXTURE_HOSTNAME" >> "$GITHUB_OUTPUT"

  deploy-and-invoke-runtime-path-diagnostic:
    needs: validate-diagnostic-input
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
      RELEASE_SHA: ${{ needs.validate-diagnostic-input.outputs.release_sha }}
      DIAGNOSTIC_FIXTURE_HOSTNAME: ${{ needs.validate-diagnostic-input.outputs.fixture_hostname }}
      V2_RUNTIME_DIAGNOSTIC_EXPECTED_ORGANIZATION_ID_SHA: 9aa21989136c3edbd2f04466a25f38254f9611d1a251013f9106f2f8712f1a88
      V2_RUNTIME_DIAGNOSTIC_EXPECTED_RUNTIME_ROLE_SHA: 4a84d79d5970e7f76b4e6a11d34519a43c9a8301a20d75966737c7561352b9a9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Derive the non-secret production database-name checksum
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DATABASE_URL"
          test -n "$PRODUCTION_HYPERDRIVE_ID"
          test "$PRODUCTION_HYPERDRIVE_ID" = "$EXPECTED_PRODUCTION_HYPERDRIVE_ID"
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'

          const connection = new URL(process.env.PRODUCTION_DATABASE_URL)
          const databaseName = decodeURIComponent(connection.pathname.replace(/^\//, ''))
          if (!databaseName) throw new Error('production diagnostic requires a database name')
          const checksum = createHash('sha256').update(databaseName, 'utf8').digest('hex')
          appendFileSync(process.env.GITHUB_ENV, `V2_RUNTIME_DIAGNOSTIC_EXPECTED_DATABASE_NAME_SHA=${checksum}\n`)
          EOF
      - name: Render and deploy the route-free diagnostic Worker
        shell: bash
        env:
          V2_RUNTIME_DIAGNOSTIC_TARGET_RELEASE_SHA: ${{ needs.validate-diagnostic-input.outputs.release_sha }}
          V2_RUNTIME_DIAGNOSTIC_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
          V2_RUNTIME_DIAGNOSTIC_FIXTURE_HOSTNAME: ${{ needs.validate-diagnostic-input.outputs.fixture_hostname }}
          V2_RUNTIME_DIAGNOSTIC_EXPECTED_ORGANIZATION_ID_SHA: 9aa21989136c3edbd2f04466a25f38254f9611d1a251013f9106f2f8712f1a88
          V2_RUNTIME_DIAGNOSTIC_EXPECTED_RUNTIME_ROLE_SHA: 4a84d79d5970e7f76b4e6a11d34519a43c9a8301a20d75966737c7561352b9a9
          V2_RUNTIME_DIAGNOSTIC_CONFIG: .qa/wrangler.v2-tenant-router-runtime-diagnostic.toml
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$V2_RUNTIME_DIAGNOSTIC_EXPECTED_DATABASE_NAME_SHA"
          test "$V2_RUNTIME_DIAGNOSTIC_HYPERDRIVE_ID" = "$PRODUCTION_HYPERDRIVE_ID"
          test -n "$V2_RUNTIME_DIAGNOSTIC_EXPECTED_ORGANIZATION_ID_SHA"
          test -n "$V2_RUNTIME_DIAGNOSTIC_EXPECTED_RUNTIME_ROLE_SHA"
          node scripts/render-v2-tenant-router-runtime-diagnostic-config.mjs
          DIAGNOSTIC_WORKER_NAME="$DIAGNOSTIC_WORKER_NAME" node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'

          const configPath = process.env.V2_RUNTIME_DIAGNOSTIC_CONFIG
          const workerName = process.env.DIAGNOSTIC_WORKER_NAME
          if (!configPath || !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(workerName ?? '') || workerName.length > 63) {
            throw new Error('runtime diagnostic Worker name must be a valid workers.dev DNS label of at most 63 characters')
          }
          const rendered = readFileSync(configPath, 'utf8')
          const updated = rendered.replace(/^name\s*=\s*"[^"]+"\s*$/m, `name = "${workerName}"`)
          if (updated === rendered || !updated.includes(`name = "${workerName}"`)) {
            throw new Error('runtime diagnostic config must have exactly one Worker name override')
          }
          writeFileSync(configPath, updated, 'utf8')
          EOF
          if grep -Eq '(^routes\s*=|^\[\[routes\]\]|custom_domain\s*=)' "$V2_RUNTIME_DIAGNOSTIC_CONFIG"; then
            echo 'runtime diagnostic configuration must not attach a route or custom domain' >&2
            exit 1
          fi
          npx wrangler deploy --config "$V2_RUNTIME_DIAGNOSTIC_CONFIG" --keep-vars
      - name: Bind one ephemeral internal diagnostic token
        shell: bash
        env:
          V2_RUNTIME_DIAGNOSTIC_CONFIG: .qa/wrangler.v2-tenant-router-runtime-diagnostic.toml
        run: |
          set -euo pipefail
          diagnostic_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          printf '%s' "$diagnostic_token" | npx wrangler secret put CANDIDATE_RUNTIME_DIAGNOSTIC_TOKEN --config "$V2_RUNTIME_DIAGNOSTIC_CONFIG"
          npx wrangler secret list --config "$V2_RUNTIME_DIAGNOSTIC_CONFIG" | grep -Fq '"CANDIDATE_RUNTIME_DIAGNOSTIC_TOKEN"'
          printf '%s' "$diagnostic_token" > .qa/candidate-runtime-diagnostic-token
          chmod 600 .qa/candidate-runtime-diagnostic-token
      - name: Resolve the isolated Worker workers.dev URL
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl --silent --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            2>/dev/null \
            | node -e 'let body="";process.stdin.on("data",chunk=>body+=chunk).on("end",()=>{try{const value=JSON.parse(body)?.result?.subdomain;if(!/^[a-z0-9-]+$/.test(value??""))process.exit(2);process.stdout.write(value)}catch{process.exit(2)}})')"
          printf 'DIAGNOSTIC_WORKERS_DEV_URL=https://%s.%s.workers.dev\n' \
            "$DIAGNOSTIC_WORKER_NAME" "$subdomain" >> "$GITHUB_ENV"
      - name: Wait for isolated Worker readiness before database diagnosis
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_token="$(cat .qa/candidate-runtime-diagnostic-token)"
          ready_url="${DIAGNOSTIC_WORKERS_DEV_URL}/ready"
          ready_response_file=.qa/candidate-runtime-diagnostic-ready-response.json
          readiness_window_seconds=90
          max_attempts=10
          max_request_timeout_seconds=15
          max_delay_seconds=12
          started_at="$(date +%s)"
          deadline=$((started_at + readiness_window_seconds))
          delay_seconds=1
          ready=false

          for attempt in $(seq 1 "$max_attempts"); do
            now="$(date +%s)"
            remaining_seconds=$((deadline - now))
            if [ "$remaining_seconds" -le 0 ]; then
              break
            fi
            request_timeout="$max_request_timeout_seconds"
            if [ "$remaining_seconds" -lt "$request_timeout" ]; then
              request_timeout="$remaining_seconds"
            fi
            if ! http_status="$(curl --silent --max-time "$request_timeout" \
              --output "$ready_response_file" --write-out '%{http_code}' \
              -H "x-olfactoryops-candidate-runtime-diagnostic: $diagnostic_token" \
              "$ready_url" 2>/dev/null)"; then
              http_status=000
            fi
            echo "DIAGNOSTIC_READY_ATTEMPT=$attempt"
            echo "DIAGNOSTIC_READY_HTTP_STATUS=$http_status"
            if [ "$http_status" = "200" ]; then
              if RUNTIME_DIAGNOSTIC_RESPONSE_FILE="$ready_response_file" \
                node scripts/verify-v2-runtime-diagnostic-response.mjs ready; then
                ready=true
                break
              fi
              echo 'DIAGNOSTIC_WORKER_READINESS=FAIL'
              echo 'ROOT_CAUSE=PERSISTENT_WORKER_STARTUP_OR_PLATFORM_FAILURE'
              exit 1
            fi
            case "$http_status" in
              404|500|503)
                ;;
              *)
                break
                ;;
            esac
            if [ "$attempt" = "$max_attempts" ]; then
              break
            fi
            now="$(date +%s)"
            remaining_seconds=$((deadline - now))
            if [ "$remaining_seconds" -le 0 ]; then
              break
            fi
            sleep_seconds="$delay_seconds"
            if [ "$sleep_seconds" -gt "$remaining_seconds" ]; then
              sleep_seconds="$remaining_seconds"
            fi
            sleep "$sleep_seconds"
            delay_seconds=$((delay_seconds * 2))
            if [ "$delay_seconds" -gt "$max_delay_seconds" ]; then
              delay_seconds="$max_delay_seconds"
            fi
          done

          if [ "$ready" != true ]; then
            echo 'DIAGNOSTIC_WORKER_READINESS=FAIL'
            echo 'ROOT_CAUSE=PERSISTENT_WORKER_STARTUP_OR_PLATFORM_FAILURE'
            exit 1
          fi
          echo 'DIAGNOSTIC_WORKER_READINESS=PASS'
      - name: Invoke the ready isolated Worker once and verify safe runtime-path evidence
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_token="$(cat .qa/candidate-runtime-diagnostic-token)"
          diagnose_url="${DIAGNOSTIC_WORKERS_DEV_URL}/diagnose"
          diagnostic_response_file=.qa/candidate-runtime-diagnostic-response.json
          if ! http_status="$(curl --silent --max-time 15 \
            --output "$diagnostic_response_file" --write-out '%{http_code}' \
            -H "x-olfactoryops-candidate-runtime-diagnostic: $diagnostic_token" \
            "$diagnose_url" 2>/dev/null)"; then
            http_status=000
          fi
          case "$http_status" in
            200)
              RUNTIME_DIAGNOSTIC_RESPONSE_FILE="$diagnostic_response_file" \
                node scripts/verify-v2-runtime-diagnostic-response.mjs matrix
              ;;
            503)
              if ! RUNTIME_DIAGNOSTIC_RESPONSE_FILE="$diagnostic_response_file" \
                node scripts/verify-v2-runtime-diagnostic-response.mjs unavailable; then
                echo 'DIAGNOSTIC_SAFE_BOOLEAN_MATRIX=NOT_RECEIVED'
                echo 'DIAGNOSTIC_SAFE_UNAVAILABLE_ENVELOPE=FAIL'
                exit 1
              fi
              echo 'DIAGNOSTIC_SAFE_BOOLEAN_MATRIX=NOT_RECEIVED'
              echo 'RUNTIME_DIAGNOSTIC_EXECUTION=NOT_REACHED'
              echo 'ACTUAL_HYPERDRIVE_RUNTIME_RESOLVER=UNPROVEN'
              exit 1
              ;;
            500)
              echo 'DIAGNOSTIC_EXECUTION_ESCAPED_SAFE_HANDLER=YES'
              echo 'DIAGNOSTIC_SAFE_BOOLEAN_MATRIX=NOT_RECEIVED'
              echo 'RUNTIME_DIAGNOSTIC_EXECUTION=NOT_REACHED'
              echo 'ACTUAL_HYPERDRIVE_RUNTIME_RESOLVER=UNPROVEN'
              exit 1
              ;;
            *)
              echo "DIAGNOSTIC_DIAGNOSE_HTTP_STATUS=$http_status"
              echo 'DIAGNOSTIC_SAFE_BOOLEAN_MATRIX=NOT_RECEIVED'
              echo 'RUNTIME_DIAGNOSTIC_EXECUTION=NOT_REACHED'
              echo 'ACTUAL_HYPERDRIVE_RUNTIME_RESOLVER=UNPROVEN'
              exit 1
              ;;
          esac
      - name: Delete the isolated diagnostic Worker and temporary token
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .qa/candidate-runtime-diagnostic-token
          rm -f .qa/candidate-runtime-diagnostic-ready-response.json
          rm -f .qa/candidate-runtime-diagnostic-response.json
          worker_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DIAGNOSTIC_WORKER_NAME")"
          case "$worker_status" in
            200)
              delete_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --request DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H 'Content-Type: application/json' \
                --data '{}' \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DIAGNOSTIC_WORKER_NAME")"
              test "$delete_status" = "200"
              ;;
            404)
              ;;
            *)
              echo "unexpected diagnostic Worker lookup status: $worker_status" >&2
              exit 1
              ;;
          esac
          worker_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DIAGNOSTIC_WORKER_NAME")"
          test "$worker_status" = "404"
          echo 'TEMPORARY_DIAGNOSTIC_WORKER_CLEANUP=PASS'
          echo 'ORPHAN_DIAGNOSTIC_WORKER_EXISTS=NO'
