name: V2 Staging Scientific Publish

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact current SHA of main.
        required: true
        type: string
      push_images:
        description: Publish immutable staging scientific images after the Linux checks pass.
        required: true
        type: boolean
      confirm_publish:
        description: Type PUBLISH_STAGING_IMAGES to publish staging-only images.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-scientific-publish
  cancel-in-progress: false

env:
  STAGING_BRANCH: main

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      PUSH_IMAGES: ${{ inputs.push_images }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        name: Validate the approved staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$PUSH_IMAGES" = "true"
          test "$CONFIRM_PUBLISH" = "PUBLISH_STAGING_IMAGES"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  scientific-images:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ needs.validate-staging-revision.outputs.staging_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify pinned component provenance
        run: |
          DATABASE_URL=postgresql://schema_check:schema_check@127.0.0.1:5432/schema_check npx prisma validate --schema infra/postgres/prisma/schema.prisma
          test -f services/scientific/runtime/component-pins.json
          test -f services/scientific/runtime/model-component-pins.json
          cmp services/scientific/runtime/model-component-pins.json services/scientific/model-runtime/model-component-pins.json
      - name: Build and run Linux feature runtime checks
        run: |
          docker buildx build --platform linux/amd64 --load --file services/scientific/runtime/Dockerfile --tag olfactoryops-scientific-feature:${IMAGE_TAG} services/scientific/runtime
          docker run --rm -e SCIENTIFIC_SERVICE_SHARED_SECRET=scientific-http-test-secret --entrypoint python olfactoryops-scientific-feature:${IMAGE_TAG} -m unittest discover -s /app/tests -p 'test_*.py'
      - name: Build and run Linux model compatibility checks
        run: |
          docker buildx build --platform linux/amd64 --load --file services/scientific/model-runtime/Dockerfile --tag olfactoryops-scientific-model:${IMAGE_TAG} services/scientific/model-runtime
          docker run --rm olfactoryops-scientific-model:${IMAGE_TAG} python /opt/test_model_runtime.py
          docker run --rm -e SCIENTIFIC_SERVICE_SHARED_SECRET=model-http-test-secret --entrypoint python olfactoryops-scientific-model:${IMAGE_TAG} -m unittest discover -s /opt -p 'test_model_runtime_server.py'
          docker run --rm olfactoryops-scientific-model:${IMAGE_TAG} python /opt/olfactory_pipeline.py > model-runtime-provenance.json
      - name: Upload non-sensitive scientific CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-ci-evidence-${{ needs.validate-staging-revision.outputs.staging_sha }}
          path: model-runtime-provenance.json
          if-no-files-found: error

  publish-scientific-images:
    needs: [validate-staging-revision, scientific-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IMAGE_TAG: ${{ needs.validate-staging-revision.outputs.staging_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download verified scientific CI evidence
        uses: actions/download-artifact@v4
        with:
          name: scientific-ci-evidence-${{ needs.validate-staging-revision.outputs.staging_sha }}
          path: ci-evidence
      - name: Require staging-only Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Rebuild immutable Linux images for publishing
        run: |
          docker buildx build --platform linux/amd64 --load --file services/scientific/runtime/Dockerfile --tag olfactoryops-scientific-feature:${IMAGE_TAG} services/scientific/runtime
          docker buildx build --platform linux/amd64 --load --file services/scientific/model-runtime/Dockerfile --tag olfactoryops-scientific-model:${IMAGE_TAG} services/scientific/model-runtime
      - name: Publish immutable Cloudflare Container images
        run: |
          set -euo pipefail
          npx wrangler containers push olfactoryops-scientific-feature:${IMAGE_TAG}
          npx wrangler containers push olfactoryops-scientific-model:${IMAGE_TAG}
          npx wrangler containers images list --json > cloudflare-container-images.json
      - name: Record immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: scientific-container-${{ needs.validate-staging-revision.outputs.staging_sha }}
          path: |
            ci-evidence/model-runtime-provenance.json
            cloudflare-container-images.json
