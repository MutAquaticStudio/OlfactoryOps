name: Migrate RC13 Production Email Secrets

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: rc13-production-email-secret-migration
  cancel-in-progress: false

jobs:
  migrate-production-email-secrets:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the sealed-box implementation
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --no-input --quiet PyNaCl==1.5.0
      - name: Copy the approved production email secrets by sealed box
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LEGACY_RESEND_API_KEY: ${{ secrets.PRODUCTION_OWNER_ONBOARDING_RESEND_API_KEY }}
          LEGACY_EMAIL_FROM: ${{ secrets.PRODUCTION_OWNER_ONBOARDING_EMAIL_FROM }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate-rc13-production-email-secrets.py
