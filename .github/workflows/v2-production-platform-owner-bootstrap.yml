name: V2 Production Platform Owner Bootstrap

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact approved RC SHA containing the Platform Owner bootstrap.
        required: true
        type: string
      confirm_platform_owner_bootstrap:
        description: Type ASSIGN_PLATFORM_OWNER to run the one-time ceremony.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-production-platform-owner-bootstrap
  cancel-in-progress: false

env:
  RELEASE_BRANCH: codex/v2-production-go-live
  RC10_SHA: fe77c96f9306e3a0ce9622e9f7eef6ee2b5cf6dd
  RC10_TAG: v2-production-rc10

jobs:
  validate-production-revision:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_PLATFORM_OWNER_BOOTSTRAP: ${{ inputs.confirm_platform_owner_bootstrap }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Validate the approved bootstrap revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PLATFORM_OWNER_BOOTSTRAP" = "ASSIGN_PLATFORM_OWNER"
          test "$RELEASE_SHA" = "$RC10_SHA"
          git fetch --no-tags origin "$RELEASE_BRANCH"
          release_branch_sha="$(git rev-parse FETCH_HEAD)"
          git fetch --force --tags origin
          release_sha="$(git rev-parse "${RELEASE_SHA}^{commit}")"
          test "$release_sha" = "$release_branch_sha"
          test "$(git rev-list -n 1 "$RC10_TAG")" = "$RC10_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  bootstrap-platform-owner:
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
      PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA: ${{ vars.PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA }}
      PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA: ${{ vars.PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require exact protected production revalidation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA" = "$RELEASE_SHA"
          test "$PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA" = "$RELEASE_SHA"
      - name: Assign the one-time Platform Owner without logging identity or credentials
        shell: bash
        env:
          PLATFORM_OWNER_BOOTSTRAP_EMAIL: ${{ secrets.PLATFORM_OWNER_BOOTSTRAP_EMAIL }}
          PLATFORM_BOOTSTRAP_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PLATFORM_OWNER_BOOTSTRAP_ENVIRONMENT: production
          CONFIRM_PLATFORM_OWNER_BOOTSTRAP: ${{ inputs.confirm_platform_owner_bootstrap }}
          V2_PRODUCTION_PLATFORM_OWNER_BOOTSTRAP_APPROVED: ASSIGN_PLATFORM_OWNER
        run: |
          set -euo pipefail
          test -n "$PLATFORM_OWNER_BOOTSTRAP_EMAIL"
          test -n "$PLATFORM_BOOTSTRAP_DATABASE_URL"
          test "$PLATFORM_OWNER_BOOTSTRAP_ENVIRONMENT" = "production"
          test "$CONFIRM_PLATFORM_OWNER_BOOTSTRAP" = "ASSIGN_PLATFORM_OWNER"
          test "$V2_PRODUCTION_PLATFORM_OWNER_BOOTSTRAP_APPROVED" = "ASSIGN_PLATFORM_OWNER"
          npm run bootstrap:platform-owner
