name: V2 Production Candidate Billing Runtime Differential Diagnostic

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC9 SHA.
        required: true
        type: string
      confirm_diagnostic:
        description: Type DIAGNOSE_RC9_BILLING_RUNTIME to run one bounded diagnostic fixture.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-production-candidate-billing-runtime-diagnostic
  cancel-in-progress: false

env:
  RC9_SHA: de0734df2d2b5b2dd3a2a67ee542131235e75eb7
  CANDIDATE_API_SERVICE: olfactoryops-v2-api-production-candidate
  EXPECTED_HYPERDRIVE_ID: b415b7572d9f45058ebb4ec4166b8739

jobs:
  validate-diagnostic-input:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: validate
        name: Validate immutable RC9 billing-runtime diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v2-production-candidate-billing-runtime-diagnostic-workflow.mjs
          test "$CONFIRM_DIAGNOSTIC" = 'DIAGNOSE_RC9_BILLING_RUNTIME'
          test "$RELEASE_SHA" = "$RC9_SHA"
          git fetch --tags origin
          test "$(git rev-parse v2-production-rc9^{})" = "$RC9_SHA"
          printf 'release_sha=%s\n' "$RC9_SHA" >> "$GITHUB_OUTPUT"

  diagnose-billing-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    needs: validate-diagnostic-input
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      RELEASE_SHA: ${{ needs.validate-diagnostic-input.outputs.release_sha }}
      CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic }}
      TEMP_BILLING_WORKER_NAME: oo-v2-billing-runtime-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-diagnostic-input.outputs.release_sha }}
          path: rc9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ops/package-lock.json
            rc9/package-lock.json
      - name: Install operations and exact RC9 diagnostic dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix ops
          npm ci --ignore-scripts --prefix rc9
      - name: Prepare the exact RC9 Prisma client and route-free temporary Worker
        shell: bash
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@localhost:5432/diagnostic
        run: |
          set -euo pipefail
          umask 077
          test "$(git -C rc9 rev-parse HEAD)" = "$RELEASE_SHA"
          test -f rc9/package-lock.json
          grep -Fq 'runtime  = "workerd"' rc9/infra/postgres/prisma/schema.prisma
          grep -Fq 'include: { plan: true }' rc9/services/platform/src/prisma-repository.ts
          rc9/node_modules/.bin/prisma generate --schema rc9/infra/postgres/prisma/schema.prisma >/dev/null 2>&1
          qa_dir="$GITHUB_WORKSPACE/rc9/.qa/oo-v2-billing-runtime-$GITHUB_RUN_ID"
          mkdir -p "$qa_dir"
          chmod 700 "$qa_dir"
          cp ops/worker/v2-billing-runtime-diagnostic.ts "$qa_dir/billing-worker.ts"
          cat > "$qa_dir/wrangler.toml" <<EOF
          name = "$TEMP_BILLING_WORKER_NAME"
          main = "billing-worker.ts"
          compatibility_date = "2026-08-11"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true

          [[hyperdrive]]
          binding = "HYPERDRIVE"
          id = "${EXPECTED_HYPERDRIVE_ID}"
          EOF
          test "$(grep -Ec '^name = "oo-v2-billing-runtime-[0-9]+"$' "$qa_dir/wrangler.toml")" = 1
          ! grep -Eq '(^routes\s*=|^\[\[routes\]\]|custom_domain\s*=)' "$qa_dir/wrangler.toml"
          printf 'BILLING_RUNTIME_QA_DIR=%s\n' "$qa_dir" >> "$GITHUB_ENV"
      - name: Capture the active candidate API version before the temporary diagnostic
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          deployment_file="$BILLING_RUNTIME_QA_DIR/candidate-api-deployments.json"
          curl --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CANDIDATE_API_SERVICE/deployments" \
            --output "$deployment_file"
          active_version="$(node -e "const fs=require('node:fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const d=b?.success===true&&Array.isArray(b?.result?.deployments)?b.result.deployments[0]:undefined;const v=d?.strategy==='percentage'&&Array.isArray(d?.versions)&&d.versions.length===1&&d.versions[0]?.percentage===100?d.versions[0].version_id:'';if(!/^[0-9a-f-]{36}$/i.test(v))process.exit(2);process.stdout.write(v)}catch{process.exit(2)}" "$deployment_file")"
          printf 'INITIAL_CANDIDATE_API_VERSION=%s\n' "$active_version" >> "$GITHUB_ENV"
          printf 'CANDIDATE_API_ACTIVE_VERSION_PRE_DIAGNOSTIC=PASS\n' >> "$GITHUB_ENV"
      - name: Deploy the temporary route-free billing diagnostic Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test "${#TEMP_BILLING_WORKER_NAME}" -le 63
          test "$EXPECTED_HYPERDRIVE_ID" = 'b415b7572d9f45058ebb4ec4166b8739'
          printf 'BILLING_RUNTIME_WORKER_DEPLOY_ATTEMPTED=YES\n' >> "$GITHUB_ENV"
          if ! (cd "$BILLING_RUNTIME_QA_DIR" && "$GITHUB_WORKSPACE/rc9/node_modules/.bin/wrangler" deploy --config wrangler.toml >deploy.stdout 2>deploy.stderr); then
            echo 'BILLING_RUNTIME_WORKER_DEPLOY=FAIL'
            exit 1
          fi
          echo 'BILLING_RUNTIME_WORKER_DEPLOY=PASS'
      - name: Bind one ephemeral internal diagnostic token
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          printf '%s' "$token" > "$BILLING_RUNTIME_QA_DIR/token"
          chmod 600 "$BILLING_RUNTIME_QA_DIR/token"
          if ! (cd "$BILLING_RUNTIME_QA_DIR" && printf '%s' "$token" | "$GITHUB_WORKSPACE/rc9/node_modules/.bin/wrangler" secret put BILLING_RUNTIME_DIAGNOSTIC_TOKEN --config wrangler.toml >secret.stdout 2>secret.stderr); then
            echo 'BILLING_RUNTIME_SECRET_BINDING=FAIL'
            exit 1
          fi
          echo 'BILLING_RUNTIME_SECRET_BINDING=PASS'
      - name: Resolve temporary workers.dev URL and prove readiness without a database probe
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          subdomain_file="$BILLING_RUNTIME_QA_DIR/subdomain.json"
          curl --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --output "$subdomain_file"
          subdomain="$(node -e "const fs=require('node:fs');try{const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))?.result?.subdomain;if(!/^[a-z0-9-]+$/.test(value??''))process.exit(2);process.stdout.write(value)}catch{process.exit(2)}" "$subdomain_file")"
          url="https://${TEMP_BILLING_WORKER_NAME}.${subdomain}.workers.dev"
          printf '%s' "$url" > "$BILLING_RUNTIME_QA_DIR/url"
          chmod 600 "$BILLING_RUNTIME_QA_DIR/url"
          ready=false
          for attempt in $(seq 1 6); do
            status="$(curl --silent --max-time 15 --output "$BILLING_RUNTIME_QA_DIR/ready.json" --write-out '%{http_code}' \
              -H "x-olfactoryops-billing-runtime-diagnostic: $(cat "$BILLING_RUNTIME_QA_DIR/token")" \
              "$url/ready" 2>/dev/null || printf '000')"
            if [ "$status" = 200 ] && node -e "const fs=require('node:fs');try{const b=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(b?.billingRuntimeDiagnostic==='READY'?0:1)}catch{process.exit(1)}" "$BILLING_RUNTIME_QA_DIR/ready.json"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo 'BILLING_RUNTIME_WORKER_READINESS=FAIL'
            exit 1
          fi
          echo 'BILLING_RUNTIME_WORKER_READINESS=PASS'
      - name: Create one bounded fixture and run the safe billing differential matrix
        shell: bash
        env:
          PRODUCTION_CANDIDATE_ACCEPTANCE_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V2_PRODUCTION_CANDIDATE_API_ORIGIN: https://api-next.labofscents.org
          V2_PRODUCTION_CANDIDATE_TENANT_URL: https://rc9-release-31736285494-469ca8942a.next.labofscents.org
        run: |
          set -euo pipefail
          export BILLING_RUNTIME_DIAGNOSTIC_URL="$(cat "$BILLING_RUNTIME_QA_DIR/url")"
          export BILLING_RUNTIME_DIAGNOSTIC_TOKEN="$(cat "$BILLING_RUNTIME_QA_DIR/token")"
          node ops/scripts/diagnose-v2-production-candidate-billing-runtime.mjs
      - name: Delete temporary billing diagnostic Worker and local evidence
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          case "$TEMP_BILLING_WORKER_NAME" in oo-v2-billing-runtime-[0-9]*) ;; *) exit 1 ;; esac
          status="$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TEMP_BILLING_WORKER_NAME" || printf '000')"
          case "$status" in
            200)
              delete_status="$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' --request DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TEMP_BILLING_WORKER_NAME" || printf '000')"
              test "$delete_status" = 200
              ;;
            404) ;;
            *) exit 1 ;;
          esac
          status="$(curl --silent --max-time 20 --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TEMP_BILLING_WORKER_NAME" || printf '000')"
          test "$status" = 404
          fixture_cleanup="${BILLING_RUNTIME_DIAGNOSTIC_FIXTURE_CLEANUP:-NOT_REQUIRED}"
          case "$fixture_cleanup" in PASS|NOT_REQUIRED) ;; *) exit 1 ;; esac
          qa_dir="${BILLING_RUNTIME_QA_DIR:-}"
          if [ -n "$qa_dir" ]; then
            case "$qa_dir" in "$GITHUB_WORKSPACE"/rc9/.qa/oo-v2-billing-runtime-*) rm -rf "$qa_dir" ;; *) exit 1 ;; esac
          fi
          echo 'BILLING_RUNTIME_DIAGNOSTIC_CLEANUP=PASS'
