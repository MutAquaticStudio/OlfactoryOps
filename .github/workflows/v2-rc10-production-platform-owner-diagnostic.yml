name: V2 RC10 Production Platform Owner Diagnostic

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC10 SHA.
        required: true
        type: string
      confirm_diagnostic:
        description: Type DIAGNOSE_RC10_PLATFORM_OWNER_BOOTSTRAP.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-rc10-production-platform-owner-diagnostic
  cancel-in-progress: false

env:
  RC10_SHA: fe77c96f9306e3a0ce9622e9f7eef6ee2b5cf6dd
  RC10_TAG: v2-production-rc10

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate immutable RC10 diagnostic request
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRM_DIAGNOSTIC: ${{ inputs.confirm_diagnostic }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_DIAGNOSTIC" = DIAGNOSE_RC10_PLATFORM_OWNER_BOOTSTRAP
          test "$RELEASE_SHA" = "$RC10_SHA"
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$RC10_TAG")" = "$RC10_SHA"
          echo "release_sha=$RC10_SHA" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - name: Install exact RC10 dependencies without provider credentials
        working-directory: release
        run: npm ci
      - name: Diagnose the Platform Owner bootstrap with a read-only database session
        env:
          RELEASE_WORKTREE: ${{ github.workspace }}/release
          PLATFORM_OWNER_BOOTSTRAP_EMAIL: ${{ secrets.PLATFORM_OWNER_BOOTSTRAP_EMAIL }}
          PLATFORM_BOOTSTRAP_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node ops/scripts/diagnose-v2-production-platform-owner-bootstrap.mjs | tee "$RUNNER_TEMP/platform-owner-diagnostic.txt"
          test -s "$RUNNER_TEMP/platform-owner-diagnostic.txt"
      - name: Remove runner-local diagnostic evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/platform-owner-diagnostic.txt"
