name: V2 Staging Pages Deployment

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact current SHA of main.
        required: true
        type: string
      confirm_staging:
        description: Type DEPLOY_STAGING_PAGES to deploy only beta.labofscents.org.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-pages-deployment
  cancel-in-progress: false

env:
  STAGING_BRANCH: main
  STAGING_PAGES_PROJECT: olfactoryops-beta
  STAGING_PAGES_BRANCH: beta
  STAGING_PAGES_HOST: beta.labofscents.org

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        name: Validate the approved staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STAGING" = "DEPLOY_STAGING_PAGES"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  deploy-staging-pages:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAGING_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      RELEASE_GIT_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      RELEASE_ENVIRONMENT: staging
      VITE_API_BASE_URL: https://api-beta.labofscents.org/api/v1
      # The Pages host remains beta.labofscents.org. Tenant hosts use the
      # separately TLS-covered api-beta wildcard and are resolved by the
      # staging Tenant Router Worker before Pages is reached.
      VITE_V2_WORKSPACE_BASE_DOMAIN: api-beta.labofscents.org
      VITE_V2_STAGING_PUBLIC_CUTOVER: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require staging-only Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Build the exact staging Pages artifact
        run: npm run build
      - name: Verify the staged public header contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "https://static.cloudflareinsights.com" dist/_headers
          grep -F "no-transform" dist/_headers
      - name: Deploy only the beta Pages branch
        run: >-
          npx wrangler pages deploy dist
          --project-name "$STAGING_PAGES_PROJECT"
          --branch "$STAGING_PAGES_BRANCH"
          --commit-hash "$STAGING_SHA"
          --commit-message "staging ${STAGING_SHA}"
          --commit-dirty=false
      - name: Require the staging hostname to activate on the staging Pages project
        shell: bash
        run: |
          set -euo pipefail
          domains_json="$(mktemp)"
          trap 'rm -f "$domains_json"' EXIT
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$STAGING_PAGES_PROJECT/domains" \
              --output "$domains_json"
            if DOMAINS_JSON="$domains_json" STAGING_PAGES_HOST="$STAGING_PAGES_HOST" node --input-type=module -e "import { readFileSync } from 'node:fs'; const body = JSON.parse(readFileSync(process.env.DOMAINS_JSON, 'utf8')); const domain = body?.success === true && Array.isArray(body.result) ? body.result.find((candidate) => candidate?.name === process.env.STAGING_PAGES_HOST) : undefined; if (domain?.status !== 'active') process.exit(1)"; then
              echo 'STAGING_PAGES_DOMAIN_BINDING=PASS'
              break
            fi
            if [ "$attempt" = 36 ]; then
              echo 'staging Pages hostname did not activate on the staging project' >&2
              exit 1
            fi
            sleep 5
          done
      - name: Verify the live staging CSP and HTML transform boundary
        shell: bash
        env:
          STAGING_PAGES_HOST: ${{ env.STAGING_PAGES_HOST }}
        run: |
          set -euo pipefail
          STAGING_PAGES_HOST="$STAGING_PAGES_HOST" node --input-type=module <<'NODE'
          const url = `https://${process.env.STAGING_PAGES_HOST}/v2/login?staging_csp_probe=${Date.now()}`
          const response = await fetch(url, { headers: { accept: 'text/html', 'user-agent': 'Mozilla/5.0' }, cache: 'no-store' })
          const html = await response.text()
          const csp = response.headers.get('content-security-policy') ?? ''
          const cacheControl = response.headers.get('cache-control') ?? ''
          if (!response.ok) throw new Error(`staging Pages login returned HTTP ${response.status}`)
          if (!csp.includes('https://static.cloudflareinsights.com')) throw new Error('staging Pages CSP does not allow the configured Cloudflare analytics origin')
          if (!cacheControl.includes('no-transform')) throw new Error('staging Pages HTML is not protected from edge script injection')
          if (html.includes('/cdn-cgi/challenge-platform/')) throw new Error('Cloudflare JavaScript Detection was injected despite the no-transform boundary')
          console.log('STAGING_PAGES_DEPLOY=PASS')
          console.log('STAGING_PAGES_CSP=PASS')
          console.log('STAGING_PAGES_NO_TRANSFORM=PASS')
          NODE
