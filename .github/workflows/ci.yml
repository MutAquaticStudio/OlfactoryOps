name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Release identity
        run: npm run release:identity:check

      - name: Migration inventory
        run: npm run release:migrations:verify

      - name: Release documentation
        run: npm run release:docs:check

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: API build
        run: npm run build:api

      - name: Legacy Prisma schema validation
        env:
          DATABASE_URL: postgresql://schema_check:schema_check@127.0.0.1:5432/schema_check
        run: npm run prisma:validate

      - name: Worker typecheck
        run: npm run typecheck:worker

      - name: Worker dry build
        run: npm run build:worker

      - name: Tenant router dry build
        run: npm run build:tenant-router

      - name: Cloud runtime dry build
        run: npm run build:cloud-runtime

      - name: Release manifest schema
        run: npm run release:manifest:generate && npm run release:manifest:validate

      - name: Client bundle secret scan
        run: npm run security:client-bundle

      - name: V2 Prisma schema validation
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/olfactoryops_ci
        run: npm run prisma:validate:v2

      - name: Production dependency audit
        # Prisma's optional CLI/config chain is not shipped by the application.
        # Keep the gate focused on production and non-optional dependencies.
        run: npm audit --audit-level=high --omit=dev --omit=optional

  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: olfactoryops_security
          POSTGRES_USER: olfactoryops_security
          POSTGRES_PASSWORD: olfactoryops_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olfactoryops_security -d olfactoryops_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Platform registry RLS and grant verification
        env:
          V2_QA_DATABASE_URL: postgresql://olfactoryops_security:olfactoryops_security@127.0.0.1:5432/olfactoryops_security
        run: npm run test:v2:platform-registry-security

  d1-router-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Fresh local D1 migration chain
        run: npx wrangler d1 migrations apply olfactoryops-test --local --config wrangler.test.toml --persist-to .qa/ci-d1

      - name: Tenant router dry build
        run: npm run build:tenant-router
