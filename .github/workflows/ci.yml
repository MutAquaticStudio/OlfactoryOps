name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: API build
        run: npm run build:api

      - name: Worker typecheck
        run: npm run typecheck:worker

      - name: Client bundle secret scan
        run: npm run security:client-bundle

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/olfactoryops_ci
        run: npm run prisma:validate

      - name: Dependency audit
        run: npm audit --audit-level=high
