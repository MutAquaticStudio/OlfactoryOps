name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: API build
        run: npm run build:api

      - name: Prisma schema validation
        run: npm run prisma:validate

      - name: Dependency audit
        run: npm audit --audit-level=high
