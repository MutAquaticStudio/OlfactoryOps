name: V2 Production Release Dispatcher

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC10 SHA.
        required: true
        type: string
      operation:
        description: One bounded release operation. No arbitrary command input is accepted.
        required: true
        type: choice
        options:
          - api
          - tenant-router
          - pages
          - pages-domain-token-preflight
          - pages-domain-handoff
          - cloud-runtime
          - route-handoff
          - smoke
      confirm_production:
        description: Type the exact confirmation required for the selected operation.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-production-release-dispatch
  cancel-in-progress: false

env:
  RELEASE_BRANCH: codex/v2-production-go-live
  ACTIVE_RC_TAG: v2-production-rc10
  ACTIVE_RC_SHA: fe77c96f9306e3a0ce9622e9f7eef6ee2b5cf6dd
  READINESS_TAG: v2-production-ready

jobs:
  validate-production-revision:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
      operation: ${{ steps.revision.outputs.operation }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: revision
        name: Validate the approved production revision and bounded operation
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$ACTIVE_RC_SHA"
          case "$OPERATION" in
            api) expected_confirmation=DEPLOY_PRODUCTION_API ;;
            tenant-router) expected_confirmation=DEPLOY_PRODUCTION_TENANT_ROUTER ;;
            pages) expected_confirmation=DEPLOY_PRODUCTION_PAGES ;;
            pages-domain-token-preflight) expected_confirmation=VERIFY_PRODUCTION_PAGES_DOMAIN_TOKEN ;;
            pages-domain-handoff) expected_confirmation=HANDOFF_PRODUCTION_PAGES_DOMAIN ;;
            cloud-runtime) expected_confirmation=DEPLOY_PRODUCTION_CLOUD_RUNTIME ;;
            route-handoff) expected_confirmation=HANDOFF_PRODUCTION_FIRST_RELEASE_ROUTES ;;
            smoke) expected_confirmation=RUN_PRODUCTION_SMOKE ;;
            *) exit 1 ;;
          esac
          test "$CONFIRM_PRODUCTION" = "$expected_confirmation"
          git fetch --no-tags origin "$RELEASE_BRANCH"
          release_branch_sha="$(git rev-parse FETCH_HEAD)"
          git fetch --tags origin
          test "$RELEASE_SHA" = "$release_branch_sha"
          test "$(git rev-list -n 1 "$ACTIVE_RC_TAG")" = "$ACTIVE_RC_SHA"
          test "$(git rev-list -n 1 "$READINESS_TAG")" = "$ACTIVE_RC_SHA"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"

  deploy-production-api:
    if: ${{ needs.validate-production-revision.outputs.operation == 'api' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_SESSION_PEPPER: ${{ secrets.V2_SESSION_PEPPER }}
      V2_PASSWORD_PEPPER: ${{ secrets.V2_PASSWORD_PEPPER }}
      V2_INVITATION_ENCRYPTION_KEY: ${{ secrets.V2_INVITATION_ENCRYPTION_KEY }}
      V2_API_PRODUCTION_GIT_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
      V2_API_PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
      PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA: ${{ vars.PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA }}
      PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA: ${{ vars.PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --prefix release
      - name: Require protected production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$V2_API_PRODUCTION_HYPERDRIVE_ID"
          test "$PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA" = "$V2_API_PRODUCTION_GIT_SHA"
          test "$PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA" = "$V2_API_PRODUCTION_GIT_SHA"
      - name: Render and deploy the exact production API candidate
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          npm run prisma:generate:v2
          npm run generate:v2-worker-transport
          node scripts/render-v2-api-production-config.mjs
          node ../ops/scripts/prepare-v2-first-release-unrouted-config.mjs .qa/wrangler.v2-api-production.toml api
          npx wrangler deploy --config .qa/wrangler.v2-api-production.toml
      - name: Bind rotated production API secrets without logging values
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          for secret_name in V2_SESSION_PEPPER V2_PASSWORD_PEPPER V2_INVITATION_ENCRYPTION_KEY; do
            secret_value="${!secret_name}"
            test -n "$secret_value"
            printf '%s' "$secret_value" | npx wrangler secret put "$secret_name" --config .qa/wrangler.v2-api-production.toml
            unset secret_value
          done
      - name: Verify production API secret binding names only
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          secret_names="$(npx wrangler secret list --config .qa/wrangler.v2-api-production.toml)"
          for secret_name in V2_SESSION_PEPPER V2_PASSWORD_PEPPER V2_INVITATION_ENCRYPTION_KEY; do
            grep -Fq "\"$secret_name\"" <<< "$secret_names"
          done

  deploy-production-tenant-router:
    if: ${{ needs.validate-production-revision.outputs.operation == 'tenant-router' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_TENANT_ROUTER_PRODUCTION_GIT_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
      V2_TENANT_ROUTER_PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
      PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA: ${{ vars.PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA }}
      PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA: ${{ vars.PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --prefix release
      - id: project
        name: Resolve the exact production Pages project
        working-directory: ops
        run: node scripts/resolve-v2-production-pages-project.mjs
      - id: pages
        name: Resolve and verify the immutable production Pages origin
        env:
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_PAGES_BRANCH: production
          PRODUCTION_PAGES_PROJECT: ${{ steps.project.outputs.project }}
        run: node ops/scripts/resolve-v2-production-pages-origin.mjs
      - name: Export the verified production Pages origin
        shell: bash
        run: |
          echo "PRODUCTION_PAGES_PROJECT=${{ steps.project.outputs.project }}" >> "$GITHUB_ENV"
          echo "V2_TENANT_ROUTER_PRODUCTION_PAGES_ORIGIN=${{ steps.pages.outputs.origin }}" >> "$GITHUB_ENV"
      - name: Require protected production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$V2_TENANT_ROUTER_PRODUCTION_HYPERDRIVE_ID"
          test -n "$V2_TENANT_ROUTER_PRODUCTION_PAGES_ORIGIN"
          test -n "$PRODUCTION_PAGES_PROJECT"
          [[ "$V2_TENANT_ROUTER_PRODUCTION_PAGES_ORIGIN" =~ ^https://[a-z0-9-]+\.${PRODUCTION_PAGES_PROJECT}\.pages\.dev$ ]]
          if [[ "$V2_TENANT_ROUTER_PRODUCTION_PAGES_ORIGIN" == *production-candidate* ]]; then exit 1; fi
          test "$PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA" = "$V2_TENANT_ROUTER_PRODUCTION_GIT_SHA"
          test "$PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA" = "$V2_TENANT_ROUTER_PRODUCTION_GIT_SHA"
      - name: Render and deploy the exact production tenant-router candidate
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          npm run prisma:generate:v2
          node scripts/render-v2-tenant-router-production-config.mjs
          node ../ops/scripts/prepare-v2-first-release-unrouted-config.mjs .qa/wrangler.v2-tenant-router-production.toml tenantRouter
          npx wrangler deploy --config .qa/wrangler.v2-tenant-router-production.toml

  deploy-production-pages:
    if: ${{ needs.validate-production-revision.outputs.operation == 'pages' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_BASE_URL: https://api.labofscents.org/api/v1
      VITE_V2_WORKSPACE_BASE_DOMAIN: labofscents.org
      PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA: ${{ vars.PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA }}
      PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA: ${{ vars.PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --prefix release
      - id: project
        name: Resolve the exact production Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: ops
        run: node scripts/resolve-v2-production-pages-project.mjs
      - name: Export the verified production Pages project
        shell: bash
        run: echo "PRODUCTION_PAGES_PROJECT=${{ steps.project.outputs.project }}" >> "$GITHUB_ENV"
      - name: Require protected production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PRODUCTION_PAGES_PROJECT"
          test "$PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA" = "${{ needs.validate-production-revision.outputs.release_sha }}"
          test "$PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA" = "${{ needs.validate-production-revision.outputs.release_sha }}"
      - name: Build and deploy the exact production Pages candidate
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          npm run build
          npx wrangler pages deploy dist --project-name "$PRODUCTION_PAGES_PROJECT" --branch production --commit-hash "${{ needs.validate-production-revision.outputs.release_sha }}" --commit-message "production candidate ${{ needs.validate-production-revision.outputs.release_sha }}" --commit-dirty=false

  preflight-production-pages-domain-token:
    if: ${{ needs.validate-production-revision.outputs.operation == 'pages-domain-token-preflight' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - name: Verify exact production Zone and DNS read access without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/handoff-v2-rc10-production-pages-domain.mjs token-preflight

  handoff-production-pages-domain:
    if: ${{ needs.validate-production-revision.outputs.operation == 'pages-domain-handoff' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - id: preflight
        name: Preflight the exact RC10 Pages domain handoff and predecessor DNS state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PAGES_DOMAIN_BASELINE_FILE: ${{ runner.temp }}/v2-production-pages-domain-handoff-${{ github.run_id }}/baseline.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$PAGES_DOMAIN_BASELINE_FILE")"
          chmod 700 "$(dirname "$PAGES_DOMAIN_BASELINE_FILE")"
          node ops/scripts/handoff-v2-rc10-production-pages-domain.mjs preflight
          test -s "$PAGES_DOMAIN_BASELINE_FILE"
          chmod 600 "$PAGES_DOMAIN_BASELINE_FILE"
      - id: handoff
        name: Handoff only the verified production Pages apex to exact RC10
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PAGES_DOMAIN_BASELINE_FILE: ${{ runner.temp }}/v2-production-pages-domain-handoff-${{ github.run_id }}/baseline.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node ops/scripts/handoff-v2-rc10-production-pages-domain.mjs handoff
      - name: Restore the exact Pages predecessor if the bounded handoff fails
        if: ${{ failure() && steps.preflight.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PAGES_DOMAIN_BASELINE_FILE: ${{ runner.temp }}/v2-production-pages-domain-handoff-${{ github.run_id }}/baseline.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node ops/scripts/handoff-v2-rc10-production-pages-domain.mjs recover
      - name: Remove runner-local Pages domain handoff state
        if: ${{ always() }}
        env:
          PAGES_DOMAIN_BASELINE_DIRECTORY: ${{ runner.temp }}/v2-production-pages-domain-handoff-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$PAGES_DOMAIN_BASELINE_DIRECTORY"
          test ! -e "$PAGES_DOMAIN_BASELINE_DIRECTORY"

  handoff-production-first-release-routes:
    if: ${{ needs.validate-production-revision.outputs.operation == 'route-handoff' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Reverify the approved baseline and hand off only exact RC10 route targets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
          PRODUCTION_FIRST_RELEASE_ROUTE_BASELINE: ${{ secrets.PRODUCTION_FIRST_RELEASE_ROUTE_BASELINE }}
          PRODUCTION_SMOKE_TENANT_HOSTNAME: ${{ vars.PRODUCTION_SMOKE_TENANT_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/execute-v2-first-release-route-handoff.mjs

  deploy-production-cloud-runtime:
    if: ${{ needs.validate-production-revision.outputs.operation == 'cloud-runtime' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CLOUD_RUNTIME_GIT_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
      CLOUD_RUNTIME_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
      SCIENTIFIC_FEATURE_IMAGE: ${{ vars.PRODUCTION_SCIENTIFIC_FEATURE_IMAGE }}
      SCIENTIFIC_MODEL_IMAGE: ${{ vars.PRODUCTION_SCIENTIFIC_MODEL_IMAGE }}
      SCIENTIFIC_FEATURE_IMAGE_DIGEST: ${{ vars.PRODUCTION_SCIENTIFIC_FEATURE_IMAGE_DIGEST }}
      SCIENTIFIC_MODEL_IMAGE_DIGEST: ${{ vars.PRODUCTION_SCIENTIFIC_MODEL_IMAGE_DIGEST }}
      PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA: ${{ vars.PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA }}
      PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA: ${{ vars.PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --prefix release
      - name: Require protected production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUD_RUNTIME_HYPERDRIVE_ID"
          test "$PRODUCTION_RUNTIME_SECRET_ROTATION_RELEASE_SHA" = "$CLOUD_RUNTIME_GIT_SHA"
          test "$PRODUCTION_ENVIRONMENT_REVALIDATED_RELEASE_SHA" = "$CLOUD_RUNTIME_GIT_SHA"
      - id: trigger_preflight
        name: Preflight exact private Cloud Runtime trigger ownership
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/handoff-v2-production-cloud-runtime-queue-consumers.mjs preflight
      - name: Render the exact private production Cloud Runtime configurations
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          npm run prisma:generate:v2
          npm run cloud-runtime:render-production
          node scripts/validate-cloud-runtime-config.mjs .qa/wrangler.v2-cloud-runtime.production.toml
          node ../ops/scripts/prepare-v2-cloud-runtime-trigger-config.mjs .qa/wrangler.v2-cloud-runtime.production.toml .qa/wrangler.v2-cloud-runtime.production.bootstrap.toml bootstrap
          node ../ops/scripts/prepare-v2-cloud-runtime-trigger-config.mjs .qa/wrangler.v2-cloud-runtime.production.toml .qa/wrangler.v2-cloud-runtime.production.workflow.toml workflowHandoff
          node ../ops/scripts/prepare-v2-cloud-runtime-trigger-config.mjs .qa/wrangler.v2-cloud-runtime.production.toml .qa/wrangler.v2-cloud-runtime.production.candidate-recovery.toml candidateRecovery
      - name: Bootstrap the exact private production Cloud Runtime only when absent
        if: ${{ steps.trigger_preflight.outputs.production_runtime_state == 'ABSENT' }}
        working-directory: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config .qa/wrangler.v2-cloud-runtime.production.bootstrap.toml
      - name: Bind and verify the private runtime secret name before queue handoff
        working-directory: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCIENTIFIC_CONTAINER_SHARED_SECRET: ${{ secrets.SCIENTIFIC_CONTAINER_SHARED_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCIENTIFIC_CONTAINER_SHARED_SECRET"
          printf '%s' "$SCIENTIFIC_CONTAINER_SHARED_SECRET" | npx --no-install wrangler secret put SCIENTIFIC_CONTAINER_SHARED_SECRET --config .qa/wrangler.v2-cloud-runtime.production.bootstrap.toml
          npx --no-install wrangler secret list --config .qa/wrangler.v2-cloud-runtime.production.bootstrap.toml | grep -Fq '"SCIENTIFIC_CONTAINER_SHARED_SECRET"'
      - id: workflow_trigger
        name: Transfer the exact scientific Workflow only when candidate-owned
        if: ${{ steps.trigger_preflight.outputs.initial_workflow_owner == 'CANDIDATE' }}
        working-directory: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config .qa/wrangler.v2-cloud-runtime.production.workflow.toml
      - id: queue_handoff
        name: Handoff exact candidate queue consumers with verified recovery
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/handoff-v2-production-cloud-runtime-queue-consumers.mjs handoff
      - name: Restore the exact candidate Workflow after an interrupted handoff
        if: ${{ failure() && steps.trigger_preflight.outputs.initial_workflow_owner == 'CANDIDATE' && (steps.workflow_trigger.outcome == 'failure' || steps.queue_handoff.outcome == 'failure') }}
        working-directory: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config .qa/wrangler.v2-cloud-runtime.production.candidate-recovery.toml --keep-vars
          node ../ops/scripts/handoff-v2-production-cloud-runtime-queue-consumers.mjs candidate-recovery
      - name: Verify the exact private production Cloud Runtime trigger handoff
        if: ${{ success() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
          PRODUCTION_HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/handoff-v2-production-cloud-runtime-queue-consumers.mjs postflight

  smoke-production:
    if: ${{ needs.validate-production-revision.outputs.operation == 'smoke' }}
    needs: validate-production-revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ needs.validate-production-revision.outputs.release_sha }}
      PRODUCTION_SMOKE_APP_URL: https://labofscents.org
      PRODUCTION_SMOKE_TENANT_URL: https://${{ vars.PRODUCTION_SMOKE_TENANT_HOSTNAME }}
      PRODUCTION_SMOKE_API_URL: https://api.labofscents.org
      PRODUCTION_SMOKE_LOGIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_LOGIN_EMAIL }}
      PRODUCTION_SMOKE_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate-production-revision.outputs.release_sha }}
          path: release
          persist-credentials: false
      - name: Run the bounded production smoke harness
        run: node ops/scripts/verify-v2-production-public-smoke.mjs
