name: Release candidate

on:
  workflow_dispatch:
    inputs:
      deploy_test_candidate:
        description: Deploy the exact current Git SHA to isolated Cloudflare test resources
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate-deploy:
    if: ${{ inputs.deploy_test_candidate }}
    runs-on: ubuntu-latest
    environment: release-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      QA_ROLE_STORAGE_STATES: ${{ secrets.QA_ROLE_STORAGE_STATES }}
      RELEASE_GIT_SHA: ${{ github.sha }}
      RELEASE_ENVIRONMENT: test
      RELEASE_PAGES_PROJECT: labofscents
      RELEASE_API_WORKER_NAME: olfactoryops-api-test
      RELEASE_TENANT_ROUTER_NAME: olfactoryops-tenant-router-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require protected test credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$QA_ROLE_STORAGE_STATES"

      - name: Validate candidate source
        run: npm run release:nonsecret-gate

      - name: Apply isolated D1 migrations
        run: npx wrangler d1 migrations apply olfactoryops-test --remote --config wrangler.test.toml

      - name: Build exact Pages candidate
        run: npm run build:test

      - name: Deploy test API provenance
        id: deploy_api
        run: npx wrangler deploy --config wrangler.test.toml --tag "candidate-${GITHUB_SHA}" --message "candidate ${GITHUB_SHA}" --var "RELEASE_GIT_SHA:${GITHUB_SHA}" --var "RELEASE_BUILD_TIMESTAMP_UTC:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Capture test API deployment ID
        id: api_deployment
        run: echo "id=$(npx wrangler deployments list --config wrangler.test.toml --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s)[0].id))')" >> "$GITHUB_OUTPUT"

      - name: Deploy test router provenance
        id: deploy_router
        run: npx wrangler deploy --config wrangler.tenant-router.test.toml --tag "candidate-${GITHUB_SHA}" --message "candidate ${GITHUB_SHA}" --var "RELEASE_GIT_SHA:${GITHUB_SHA}" --var "RELEASE_BUILD_TIMESTAMP_UTC:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Capture test router deployment ID
        id: router_deployment
        run: echo "id=$(npx wrangler deployments list --config wrangler.tenant-router.test.toml --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s)[0].id))')" >> "$GITHUB_OUTPUT"

      - name: Deploy exact Pages candidate
        run: npx wrangler pages deploy dist --project-name labofscents --branch test --commit-hash "$GITHUB_SHA" --commit-message "release candidate $GITHUB_SHA" --commit-dirty=false

      - name: Capture test Pages deployment ID
        id: pages_deployment
        run: echo "id=$(npx wrangler pages deployment list --project-name labofscents --environment preview --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s)[0].Id))')" >> "$GITHUB_OUTPUT"

      - name: Require eight-role isolated E2E
        run: npm run test:role-e2e:strict

      - name: Generate strict release manifest
        env:
          RELEASE_MANIFEST_MODE: release
          RELEASE_ROLLBACK_TARGET: ${{ vars.RELEASE_ROLLBACK_TARGET }}
          RELEASE_PAGES_DEPLOYMENT_ID: ${{ steps.pages_deployment.outputs.id }}
          RELEASE_API_WORKER_DEPLOYMENT_ID: ${{ steps.api_deployment.outputs.id }}
          RELEASE_TENANT_ROUTER_DEPLOYMENT_ID: ${{ steps.router_deployment.outputs.id }}
          RELEASE_TEST_PAGES_DEPLOYMENT_ID: ${{ steps.pages_deployment.outputs.id }}
          RELEASE_TEST_WORKER_DEPLOYMENT_ID: ${{ steps.api_deployment.outputs.id }}
          RELEASE_TEST_ROUTER_DEPLOYMENT_ID: ${{ steps.router_deployment.outputs.id }}
        run: npm run release:manifest:generate && npm run release:provenance:verify
