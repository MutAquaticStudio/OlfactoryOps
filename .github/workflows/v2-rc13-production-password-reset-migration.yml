name: V2 RC13 Production Password Reset Migration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC13 SHA containing the additive password-reset migration.
        required: true
        type: string
      confirm_migration:
        description: Type APPLY_RC13_PASSWORD_RESET_MIGRATION to apply the immutable additive migration chain.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-rc13-production-password-reset-migration
  cancel-in-progress: false

env:
  RC13_SHA: 09e96feacb9db03325683ee329fb269206a21880
  RC13_TAG: v2-production-rc13

jobs:
  validate-migration-request:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        name: Validate the immutable RC13 migration source
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_MIGRATION" = APPLY_RC13_PASSWORD_RESET_MIGRATION
          test "$RELEASE_SHA" = "$RC13_SHA"
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$RC13_TAG")" = "$RC13_SHA"
          git cat-file -e "$RC13_SHA:infra/postgres/migrations/0026_platform_password_resets.sql"
          echo "release_sha=$RC13_SHA" >> "$GITHUB_OUTPUT"
          echo 'RC13_PASSWORD_RESET_MIGRATION_SOURCE=PASS'

  apply-password-reset-migration:
    needs: validate-migration-request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      V2_RC13_PASSWORD_RESET_MIGRATION_APPROVED: APPLY_RC13_PASSWORD_RESET_MIGRATION
      RELEASE_SHA: ${{ needs.validate-migration-request.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply the immutable additive password-reset migration
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$RC13_SHA"
          test -n "$PRODUCTION_DATABASE_URL"
          node scripts/apply-v2-rc13-password-reset-migration.mjs | tee "$RUNNER_TEMP/rc13-password-reset-migration.txt"
          grep -Fxq 'RC13_PASSWORD_RESET_MIGRATION=PASS' "$RUNNER_TEMP/rc13-password-reset-migration.txt"
          grep -Fxq 'RC13_PASSWORD_RESET_RLS=PASS' "$RUNNER_TEMP/rc13-password-reset-migration.txt"
      - name: Remove runner-local migration evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rc13-password-reset-migration.txt"
