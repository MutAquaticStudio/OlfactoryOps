name: V2 RC10 Production Dedicated Smoke Identity Provisioning

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable RC10 SHA.
        required: true
        type: string
      tenant_hostname:
        description: Exact active single-label tenant hostname selected by the read-only inventory.
        required: true
        type: string
      confirm_provisioning:
        description: Type PROVISION_RC10_DEDICATED_SMOKE_IDENTITY.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-rc10-production-smoke-identity-provisioning
  cancel-in-progress: false

env:
  RC10_SHA: fe77c96f9306e3a0ce9622e9f7eef6ee2b5cf6dd
  RC10_TAG: v2-production-rc10

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      tenant_hostname: ${{ steps.release.outputs.tenant_hostname }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: release
        name: Validate immutable RC10 smoke-identity provisioning request
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          TENANT_HOSTNAME: ${{ inputs.tenant_hostname }}
          CONFIRM_PROVISIONING: ${{ inputs.confirm_provisioning }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PROVISIONING" = PROVISION_RC10_DEDICATED_SMOKE_IDENTITY
          test "$RELEASE_SHA" = "$RC10_SHA"
          [[ "$TENANT_HOSTNAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.labofscents\.org$ ]]
          test "$TENANT_HOSTNAME" != api.labofscents.org
          test "$TENANT_HOSTNAME" != admin.labofscents.org
          test "$TENANT_HOSTNAME" != next.labofscents.org
          test "$TENANT_HOSTNAME" != www.labofscents.org
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$RC10_TAG")" = "$RC10_SHA"
          printf 'release_sha=%s\n' "$RC10_SHA" >> "$GITHUB_OUTPUT"
          printf 'tenant_hostname=%s\n' "$TENANT_HOSTNAME" >> "$GITHUB_OUTPUT"

  provision:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release/package-lock.json
      - name: Install exact RC10 dependencies without provider credentials
        working-directory: release
        run: npm ci --ignore-scripts
      - name: Require the protected dedicated smoke credentials before any write
        env:
          PRODUCTION_SMOKE_LOGIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_LOGIN_EMAIL }}
          PRODUCTION_SMOKE_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_LOGIN_PASSWORD }}
          V2_PASSWORD_PEPPER: ${{ secrets.V2_PASSWORD_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_SMOKE_LOGIN_EMAIL"
          test -n "$PRODUCTION_SMOKE_LOGIN_PASSWORD"
          test -n "$V2_PASSWORD_PEPPER"
      - name: Provision one dedicated normal tenant smoke identity
        env:
          RELEASE_WORKTREE: ${{ github.workspace }}/release
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_SMOKE_TENANT_HOSTNAME: ${{ needs.validate.outputs.tenant_hostname }}
          PRODUCTION_SMOKE_LOGIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_LOGIN_EMAIL }}
          PRODUCTION_SMOKE_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_LOGIN_PASSWORD }}
          V2_PASSWORD_PEPPER: ${{ secrets.V2_PASSWORD_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$GITHUB_WORKSPACE/release/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/ops/scripts/provision-v2-rc10-production-smoke-identity.mjs" | tee "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
          grep -Fx 'PRODUCTION_SMOKE_TENANT_HOSTNAME_READY=PASS' "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
          grep -Fx 'PRODUCTION_SMOKE_LOGIN_IDENTITY_READY=PASS' "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
          grep -Fx 'PRODUCTION_SMOKE_IDENTITY_ROLE=VIEWER' "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
          grep -Fx 'PRODUCTION_SMOKE_PLATFORM_OPERATOR=ABSENT' "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
          grep -Fx 'PRODUCTION_SMOKE_IDENTITY_PROVISIONING=PASS' "$RUNNER_TEMP/production-smoke-identity-provisioning.txt"
      - name: Reverify the provisioned smoke identity with a read-only database session
        env:
          RELEASE_WORKTREE: ${{ github.workspace }}/release
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_SMOKE_TENANT_HOSTNAME: ${{ needs.validate.outputs.tenant_hostname }}
          PRODUCTION_SMOKE_LOGIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_LOGIN_EMAIL }}
          PRODUCTION_SMOKE_LOGIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node "$GITHUB_WORKSPACE/ops/scripts/verify-v2-production-smoke-tenant-readiness.mjs" | tee "$RUNNER_TEMP/production-smoke-identity-reverify.txt"
          grep -Fx 'PRODUCTION_SMOKE_TENANT_HOSTNAME_READY=PASS' "$RUNNER_TEMP/production-smoke-identity-reverify.txt"
          grep -Fx 'PRODUCTION_SMOKE_LOGIN_IDENTITY_READY=PASS' "$RUNNER_TEMP/production-smoke-identity-reverify.txt"
      - name: Remove runner-local provisioning evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/production-smoke-identity-provisioning.txt" "$RUNNER_TEMP/production-smoke-identity-reverify.txt"
