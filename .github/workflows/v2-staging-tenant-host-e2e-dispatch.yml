name: V2 Staging Tenant Host Browser Verification

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact deployed SHA of codex/cloudflare-cloud-native-runtime.
        required: true
        type: string
      confirm_staging:
        description: Type RUN_STAGING_TENANT_HOST_E2E to verify known and unknown staging tenants.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-tenant-host-browser-verification
  cancel-in-progress: false

env:
  STAGING_BRANCH: codex/cloudflare-cloud-native-runtime

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STAGING" = "RUN_STAGING_TENANT_HOST_E2E"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  verify-tenant-hosts:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      V2_STAGING_ENVIRONMENT: staging
      V2_STAGING_TENANT_HOST_APPROVED: RUN_STAGING_TENANT_HOST_E2E
      V2_STAGING_API_ORIGIN: https://api-beta.labofscents.org
      V2_STAGING_PUBLIC_PAGES_HOST: beta.labofscents.org
      V2_STAGING_WORKSPACE_BASE_DOMAIN: api-beta.labofscents.org
      V2_STAGING_EXPECTED_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the browser required for authenticated hostname verification
        run: npx playwright install --with-deps chromium
      - name: Require only the staging database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_DATABASE_URL"
      - name: Verify known and unknown tenants through the deployed route and TLS
        env:
          V2_STAGING_TENANT_EVIDENCE_DIR: ${{ runner.temp }}/staging-tenant-host-evidence
        run: node scripts/verify-v2-staging-tenant-hosts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-tenant-host-evidence-${{ needs.validate-staging-revision.outputs.staging_sha }}
          path: ${{ runner.temp }}/staging-tenant-host-evidence
          if-no-files-found: error
          retention-days: 14
