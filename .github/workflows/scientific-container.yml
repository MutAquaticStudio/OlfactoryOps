name: Scientific Container Build

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: Publish immutable images only when Cloudflare credentials are configured.
        required: false
        default: false
        type: boolean
  pull_request:
    paths: ["services/scientific/**", "scripts/verify-scientific-remote.mjs", ".github/workflows/scientific-container.yml"]
  push:
    branches: [main, master, "release-*", "codex/cloudflare-cloud-native-runtime"]
    paths: ["services/scientific/**", "scripts/verify-scientific-remote.mjs", ".github/workflows/scientific-container.yml"]

permissions:
  contents: read

jobs:
  scientific-images:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify pinned component provenance
        run: |
          DATABASE_URL=postgresql://schema_check:schema_check@127.0.0.1:5432/schema_check npx prisma validate --schema infra/postgres/prisma/schema.prisma
          test -f services/scientific/runtime/component-pins.json
          test -f services/scientific/runtime/model-component-pins.json
          cmp services/scientific/runtime/model-component-pins.json services/scientific/model-runtime/model-component-pins.json
      - name: Build and run Linux feature runtime checks
        run: |
          docker buildx build --platform linux/amd64 --load --file services/scientific/runtime/Dockerfile --tag olfactoryops-scientific-feature:${IMAGE_TAG} services/scientific/runtime
          docker run --rm -e SCIENTIFIC_SERVICE_SHARED_SECRET=scientific-http-test-secret --entrypoint python olfactoryops-scientific-feature:${IMAGE_TAG} -m unittest discover -s /app/tests -p 'test_*.py'
      - name: Build and run Linux model compatibility checks
        run: |
          docker buildx build --platform linux/amd64 --load --file services/scientific/model-runtime/Dockerfile --tag olfactoryops-scientific-model:${IMAGE_TAG} services/scientific/model-runtime
          docker run --rm olfactoryops-scientific-model:${IMAGE_TAG} python /opt/test_model_runtime.py
          docker run --rm -e SCIENTIFIC_SERVICE_SHARED_SECRET=model-http-test-secret --entrypoint python olfactoryops-scientific-model:${IMAGE_TAG} -m unittest discover -s /opt -p 'test_model_runtime_server.py'
          docker run --rm olfactoryops-scientific-model:${IMAGE_TAG} python /opt/olfactory_pipeline.py > model-runtime-provenance.json
      - name: Publish immutable Cloudflare Container images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          npx wrangler containers push olfactoryops-scientific-feature:${IMAGE_TAG}
          npx wrangler containers push olfactoryops-scientific-model:${IMAGE_TAG}
          npx wrangler containers images list --json > cloudflare-container-images.json
      - name: Record immutable image evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_images && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: scientific-container-${{ github.sha }}
          path: |
            model-runtime-provenance.json
            cloudflare-container-images.json
      - name: Credential state
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_CI_CREDENTIALS=MANUAL_SETUP_REQUIRED"
          else
            echo "CLOUDFLARE_CI_CREDENTIALS=CONFIGURED"
          fi
