name: V2 Staging Scientific Runtime Verification

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact deployed SHA of codex/cloudflare-cloud-native-runtime.
        required: true
        type: string
      confirm_staging:
        description: Type RUN_REMOTE_SCIENTIFIC_E2E to use an isolated staging fixture.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-scientific-runtime-verification
  cancel-in-progress: false

env:
  STAGING_BRANCH: codex/cloudflare-cloud-native-runtime
  STAGING_R2_BUCKET: olfactoryops-v2-artifacts-staging

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        name: Validate the approved staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STAGING" = "RUN_REMOTE_SCIENTIFIC_E2E"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  verify-scientific-runtime:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_STAGING_SCIENTIFIC_APPROVED: RUN_REMOTE_SCIENTIFIC_E2E
      V2_STAGING_API_ORIGIN: https://api-beta.labofscents.org
      V2_STAGING_PUBLIC_PAGES_HOST: beta.labofscents.org
      V2_STAGING_WORKSPACE_BASE_DOMAIN: api-beta.labofscents.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_DATABASE_URL"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Verify API Worker to Queue to Workflow to private scientific Container
        shell: bash
        run: |
          set -euo pipefail
          result_ref="$(mktemp)"
          result_file="$(mktemp)"
          tail_file="$(mktemp)"
          tail_pid=""
          emit_safe_container_diagnostics() {
            if [[ -n "$tail_pid" ]]; then
              kill -TERM -- "-$tail_pid" 2>/dev/null || true
              for _ in $(seq 1 5); do
                kill -0 "$tail_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL -- "-$tail_pid" 2>/dev/null || true
              wait "$tail_pid" 2>/dev/null || true
            fi
            TAIL_FILE="$tail_file" node --input-type=module -e '
              import { readFileSync } from "node:fs"
              const source = readFileSync(process.env.TAIL_FILE, "utf8")
              const diagnostics = []
              for (const line of source.split(/\r?\n/)) {
                const event = /scientific_container_(?:error|ready|stop)/.exec(line)?.[0]
                if (!event) continue
                const container = /container\\?"\s*:\s*\\?"(feature|model)/.exec(line)?.[1] ?? "unknown"
                const code = /SCIENTIFIC_CONTAINER_(?:CRASHED_DURING_STARTUP|EXITED_BEFORE_HEALTHY|NO_INSTANCE|PORT_UNAVAILABLE|RATE_LIMITED|REQUEST_ABORTED|RUNTIME_SIGNALLED|STARTUP_FAILED|RUNTIME_ERROR)/.exec(line)?.[0] ?? null
                const exitCode = /exitCode\\?"\s*:\s*(-?\d+)/.exec(line)?.[1] ?? null
                const errorShape = /errorShape\\?"\s*:\s*\\?"(STRING|ERROR|OBJECT_MESSAGE|OBJECT_ERROR|OBJECT_REASON|OBJECT_CONTEXT|OBJECT|UNKNOWN)/.exec(line)?.[1] ?? null
                const statusCode = /statusCode\\?"\s*:\s*(\d{3})/.exec(line)?.[1] ?? null
                const secretConfigured = /secretConfigured\\?"\s*:\s*(true|false)/.exec(line)?.[1] ?? null
                diagnostics.push({ event, container, code, exitCode, errorShape, statusCode, secretConfigured })
              }
              console.log(`CLOUD_RUNTIME_SAFE_DIAGNOSTICS=${JSON.stringify(diagnostics)}`)
            '
          }
          trap 'emit_safe_container_diagnostics; rm -f "$result_ref" "$result_file" "$tail_file"' EXIT
          setsid timeout --signal=TERM --kill-after=5s 180s npx wrangler tail olfactoryops-v2-cloud-runtime-staging --format json > "$tail_file" 2>&1 &
          tail_pid="$!"
          sleep 3
          export V2_STAGING_SCIENTIFIC_RESULT_REF_PATH="$result_ref"
          node scripts/verify-v2-staging-scientific.mjs
          artifact_ref="$(tr -d '\r\n' < "$result_ref")"
          [[ "$artifact_ref" =~ ^v2/[A-Za-z0-9_-]+/scientific/[a-f0-9]{64}$ ]]
          npx wrangler r2 object get "$STAGING_R2_BUCKET/$artifact_ref" --remote --file "$result_file"
          RESULT_FILE="$result_file" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(process.env.RESULT_FILE, 'utf8'))
          if (!result || typeof result !== 'object' || !Array.isArray(result.artifacts) || result.artifacts.length < 3) {
            throw new Error('scientific R2 result does not contain the requested feature artifacts')
          }
          console.log('R2_STAGING_SCIENTIFIC_RESULT=PASS')
          console.log('QUEUE_STAGING=PASS')
          console.log('WORKFLOW_STAGING=PASS')
          console.log('SCIENTIFIC_CONTAINER_STAGING=PASS')
          console.log('STAGING_SCIENTIFIC_E2E=PASS')
          NODE
