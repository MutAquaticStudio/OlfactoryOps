name: V2 Staging API Worker Deployment

on:
  workflow_dispatch:
    inputs:
      staging_sha:
        description: Exact current SHA of codex/cloudflare-cloud-native-runtime.
        required: true
        type: string
      confirm_staging:
        description: Type DEPLOY_STAGING_API to deploy only api-beta.labofscents.org.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v2-staging-api-worker-deployment
  cancel-in-progress: false

env:
  STAGING_BRANCH: codex/cloudflare-cloud-native-runtime
  STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3

jobs:
  validate-staging-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_sha: ${{ steps.revision.outputs.staging_sha }}
    env:
      STAGING_SHA: ${{ inputs.staging_sha }}
      CONFIRM_STAGING: ${{ inputs.confirm_staging }}
    steps:
      - uses: actions/checkout@v4
      - id: revision
        name: Validate the approved staging revision
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_STAGING" = "DEPLOY_STAGING_API"
          [[ "$STAGING_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$STAGING_BRANCH"
          test "$STAGING_SHA" = "$(git rev-parse FETCH_HEAD)"
          git cat-file -e "${STAGING_SHA}^{commit}"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

  deploy-staging-api:
    needs: validate-staging-revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V2_API_STAGING_GIT_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      V2_API_STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-staging-revision.outputs.staging_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the V2 Prisma client for the Worker runtime
        run: npm run prisma:generate:v2
      - name: Require staging-only Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Render the non-secret staging Worker configuration
        run: node scripts/render-v2-api-staging-config.mjs
      - name: Generate the checked-in controller transport delegates
        run: npm run generate:v2-worker-transport
      - name: Deploy the exact staging API Worker revision
        run: npx wrangler deploy --config .qa/wrangler.v2-api-staging.toml --keep-vars
      - name: Verify active Worker deployment, revision, and Hyperdrive binding
        env:
          STAGING_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
          STAGING_HYPERDRIVE_ID: d7ac83bd79944e9dbd1f6eef30518dc3
        run: |
          set -euo pipefail
          deployment_json="$(mktemp)"
          version_json="$(mktemp)"
          trap 'rm -f "$deployment_json" "$version_json"' EXIT

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/olfactoryops-v2-api-staging/deployments" \
            --output "$deployment_json"

          deployed_version_id="$(node --input-type=module - "$deployment_json" <<'NODE'
          import { readFileSync } from 'node:fs'

          const body = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const deployment = body?.success === true ? body?.result?.deployments?.[0] : undefined
          const versions = deployment?.versions
          if (!Array.isArray(versions) || versions.length !== 1 || versions[0]?.percentage !== 100 || typeof versions[0]?.version_id !== 'string') {
            throw new Error('expected exactly one active 100-percent Worker version')
          }
          process.stdout.write(versions[0].version_id)
          NODE
          )"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/olfactoryops-v2-api-staging/versions/$deployed_version_id" \
            --output "$version_json"

          VERSION_JSON="$version_json" DEPLOYED_VERSION_ID="$deployed_version_id" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const body = JSON.parse(readFileSync(process.env.VERSION_JSON, 'utf8'))
          if (body?.success !== true) throw new Error('Worker version lookup was not successful')
          const bindings = body?.result?.resources?.bindings
          if (!Array.isArray(bindings)) throw new Error('Worker version has no binding metadata')

          const releaseSha = bindings.find((binding) => binding?.name === 'RELEASE_GIT_SHA' && binding?.type === 'plain_text')
          const hyperdrive = bindings.find((binding) => binding?.name === 'HYPERDRIVE' && binding?.type === 'hyperdrive')
          const artifacts = bindings.find((binding) => binding?.name === 'R2_ARTIFACTS' && binding?.type === 'r2_bucket')
          const runtime = bindings.find((binding) => binding?.name === 'CLOUD_RUNTIME' && binding?.type === 'service')
          if (releaseSha?.text !== process.env.STAGING_SHA) throw new Error('active Worker release SHA does not match the approved staging revision')
          if (hyperdrive?.id !== process.env.STAGING_HYPERDRIVE_ID) throw new Error('active Worker Hyperdrive binding does not match staging')
          if (!artifacts || artifacts?.bucket_name !== 'olfactoryops-v2-artifacts-staging') throw new Error('active Worker R2 artifact binding does not match staging')
          if (!runtime || runtime?.service !== 'olfactoryops-v2-cloud-runtime-staging') throw new Error('active Worker Cloud Runtime service binding does not match staging')

          console.log(`STAGING_API_ACTIVE_VERSION=PASS ${process.env.DEPLOYED_VERSION_ID}`)
          console.log('STAGING_API_RELEASE_BINDING=PASS')
          console.log('STAGING_API_HYPERDRIVE_BINDING=PASS')
          console.log('STAGING_API_R2_BINDING=PASS')
          console.log('STAGING_API_CLOUD_RUNTIME_BINDING=PASS')
          NODE
      - name: Probe public health without treating a GitHub bot challenge as deployment truth
        env:
          STAGING_SHA: ${{ needs.validate-staging-revision.outputs.staging_sha }}
        run: |
          STAGING_SHA="$STAGING_SHA" node --input-type=module <<'NODE'
          const attempts = 20
          let last = { status: 0, mitigated: 'none', release: 'missing', database: 'missing' }
          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const healthUrl = new URL('https://api-beta.labofscents.org/health')
            healthUrl.searchParams.set('staging_probe', `${Date.now()}-${attempt}`)
            const response = await fetch(healthUrl, {
              cache: 'no-store',
              headers: {
                accept: 'application/json',
                'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
              },
            })
            const body = await response.json().catch(() => undefined)
            last = { status: response.status, mitigated: response.headers.get('cf-mitigated') ?? 'none', release: body?.releaseGitSha ?? 'missing', database: body?.database ?? 'missing' }
            const ready = response.ok
              && body?.status === 'ok'
              && body?.environment === 'staging'
              && body?.database === 'hyperdrive'
              && body?.releaseGitSha === process.env.STAGING_SHA
            if (ready) {
              console.log('STAGING_API_PUBLIC_HEALTH=PASS')
              process.exit(0)
            }
            if (response.status === 403 && response.headers.get('cf-mitigated') === 'challenge') {
              console.log('STAGING_API_PUBLIC_HEALTH=BLOCKED_GITHUB_EDGE_CHALLENGE')
              process.exit(0)
            }
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 3_000))
          }
          throw new Error(`staging public health probe failed after ${attempts} attempts: status=${last.status} mitigated=${last.mitigated} release=${last.release} database=${last.database}`)
          NODE
