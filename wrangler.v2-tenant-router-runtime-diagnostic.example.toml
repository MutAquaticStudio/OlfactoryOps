# Candidate-only Worker diagnostic. This uses workers.dev only and never binds
# a public-production route or custom domain.
name = "olfactoryops-v2-tenant-router-production-candidate-runtime-diagnostic"
main = "worker/v2-tenant-router-runtime-diagnostic.ts"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
DIAGNOSTIC_FIXTURE_HOSTNAME = "REPLACE_WITH_DIAGNOSTIC_FIXTURE_HOSTNAME"
TARGET_RELEASE_SHA = "REPLACE_WITH_TARGET_RELEASE_SHA"
V2_EXPECTED_DATABASE_NAME_SHA = "REPLACE_WITH_EXPECTED_DATABASE_NAME_SHA"
V2_RUNTIME_DB_ROLE = "hyperdrive_user"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID"
