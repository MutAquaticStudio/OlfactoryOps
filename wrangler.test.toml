name = "olfactoryops-api-test"
main = "worker/index.ts"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]
minify = true
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[vars]
CORS_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173,https://labofscents.pages.dev,https://*.labofscents.pages.dev,https://beta.labofscents.org"
BILLING_MODE = "managed_beta"
BETA_APP_ORIGIN = "https://beta.labofscents.org"

[[d1_databases]]
binding = "DB"
database_name = "olfactoryops-test"
database_id = "a5144134-3f58-4f6b-b516-05789ef05fbc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "olfactoryops-documents-test"
