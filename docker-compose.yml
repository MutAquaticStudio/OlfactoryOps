services:
  postgres:
    image: postgres:16-alpine
    container_name: olfactoryops-postgres
    environment:
      POSTGRES_DB: olfactoryops
      POSTGRES_USER: olfactoryops
      POSTGRES_PASSWORD: olfactoryops
    ports:
      - "5432:5432"
    volumes:
      - olfactoryops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olfactoryops -d olfactoryops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  olfactoryops_pgdata:
