policy: "Scientific Core must start from approved Osmo repositories via OlfactoryOps-owned adapters."

excluded:
  - repo: "osmoai/taxonomy"
    reason: "Not in Scope Lock V0.3; avoid ODbL dependency."

components:
  - repo: "osmoai/bcfp"
    license: "BSD-3-Clause"
    role: "fingerprints"
    mode: "runtime_scientific_dependency"
  - repo: "osmoai/molftp"
    license: "BSD-3-Clause"
    role: "fragment_target_features"
    mode: "runtime_scientific_dependency"
  - repo: "osmoai/osmordred"
    license: "BSD-3-Clause (verify pinned source)"
    role: "molecular_descriptors"
    mode: "runtime_scientific_dependency"
  - repo: "osmoai/kgcnn-keras-unlocked"
    license: "MIT"
    role: "gnn_models"
    mode: "research_model_dependency"
  - repo: "osmoai/transformer-CNN"
    license: "MIT"
    role: "smiles_model"
    mode: "research_model_dependency"
  - repo: "osmoai/publications"
    license: "Apache-2.0 code / CC BY 4.0 datasets"
    role: "research_code_and_datasets"
    mode: "research_data"
  - repo: "osmoai/vexo"
    license: "Apache-2.0"
    role: "chemistry_dataops"
    mode: "planning_optional"
  - repo: "osmoai/genai-toolbox"
    license: "Apache-2.0"
    role: "mcp_database_tools"
    mode: "agent_infrastructure"
  - repo: "osmoai/rdkit-pypi"
    license: "track repository and upstream RDKit independently"
    role: "rdkit_packaging_reference"
    mode: "build_reference"
